version: '3'

vars:
  # The snap wrapper requires a display; use the underlying binary for batch mode.
  EMACS: '{{.EMACS | default "/snap/emacs/current/usr/bin/emacs"}}'
  EMACS_DIR: '{{.HOME}}/.config/emacs'

tasks:
  test-dashboard:
    desc: Test the dashboard and asynchronous weather without network access
    cmds:
      - >
        {{.EMACS}} --batch -Q
        --directory "{{.TASKFILE_DIR}}/lisp"
        --load "{{.TASKFILE_DIR}}/testdata/jg-dashboard-tests.el"
        --funcall ert-run-tests-batch-and-exit

  test-dashboard-gui:
    desc: Test dashboard overlays, live animation, and redisplay hooks in Xvfb
    cmds:
      - >
        xvfb-run -a {{.EMACS}} -Q
        --directory "{{.TASKFILE_DIR}}/lisp"
        --load "{{.TASKFILE_DIR}}/testdata/jg-dashboard-tests.el"
        --load "{{.TASKFILE_DIR}}/testdata/run-dashboard-gui-tests.el"

  test-info:
    desc: Test Info deployment and discovery from the dotfiles source checkout
    cmds:
      - >
        EMACS="{{.EMACS}}" EMACS_DIR="{{.EMACS_DIR}}"
        python3 "{{.TASKFILE_DIR}}/testdata/test-emacs-info.py"

  test-ghostel:
    desc: Test quake terminals with real windows but without spawning shells
    cmds:
      - >
        {{.EMACS}} --batch -Q
        --eval '(setq package-user-dir (expand-file-name "{{.EMACS_DIR}}/var/elpa"))'
        --funcall package-initialize
        --directory "{{.TASKFILE_DIR}}/lisp"
        --load "{{.TASKFILE_DIR}}/testdata/jg-ghostel-tests.el"
        --funcall ert-run-tests-batch-and-exit

  test-ghostel-gui:
    desc: Test multiple frames and native Ghostel shells in an isolated Xvfb display
    cmds:
      - >
        xvfb-run -a {{.EMACS}} -Q
        --eval '(setq package-user-dir (expand-file-name "{{.EMACS_DIR}}/var/elpa"))'
        --funcall package-initialize
        --directory "{{.TASKFILE_DIR}}/lisp"
        --load "{{.TASKFILE_DIR}}/testdata/jg-ghostel-tests.el"
        --load "{{.TASKFILE_DIR}}/testdata/jg-ghostel-native-tests.el"
        --load "{{.TASKFILE_DIR}}/testdata/run-ghostel-gui-tests.el"

  test-boot:
    desc: Smoke-test — load the deployed Emacs config in batch mode
    cmds:
      - echo "Running Emacs boot test against {{.EMACS_DIR}} ..."
      - >
        {{.EMACS}} --batch
        --load "{{.EMACS_DIR}}/early-init.el"
        --load "{{.EMACS_DIR}}/init.el"
        2>&1
      - echo "Boot test passed."

  build-container:
    desc: Build the Docker image for container boot testing
    cmds:
        - docker build -f ./testdata/alpine.dockerfile --build-arg BASE_IMAGE -t emacs-config-boot-test .

  test-boot-container:
    desc: Build container image and run the Emacs boot test inside it
    deps:
      - build-container
